# Groceries. Same shape as the calendar's stack: app + postgres, loopback for
# tailscale serve and the path router, LAN for devices without tailscale
# (guests, the work MacBook at home).
services:
  db:
    image: postgres:17.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: groceries
      POSTGRES_PASSWORD: ${GRO_DB_PASSWORD:?set GRO_DB_PASSWORD in .env}
      POSTGRES_DB: groceries
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groceries"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GRO_DSN: postgresql://groceries:${GRO_DB_PASSWORD}@db:5432/groceries
      # THE SAME VALUES as the calendar's CAL_GATE_SECRET/CAL_GATE_USERS:
      # shared cookie, shared secret, one login across the household apps.
      GATE_SECRET: ${GATE_SECRET:-}
      GATE_USERS: ${GATE_USERS:-}
      GRO_DEVICES: ${GRO_DEVICES:-}
      GRO_PORTAL_URL: ${GRO_PORTAL_URL:-}
      TZ: ${TZ:-America/New_York}
    ports:
      # Loopback only, on purpose: a reverse proxy or a VPN front end is meant
      # to be the way in. Extra bindings (a LAN address, another port) belong
      # in a docker-compose.override.yml, which is host-specific and ignored.
      - "127.0.0.1:3030:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s

volumes:
  dbdata:
